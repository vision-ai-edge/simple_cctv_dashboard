# Bun runtime configuration
# https://bun.sh/docs/runtime/bunfig

[install]
# Use the lockfile to ensure reproducible installs
frozenLockfile = false

[test]
# Default test root.
# 주의: 워크스페이스 테스트는 `bun run test` (= `bun run --filter='*' test`) 로 실행하세요.
# 각 패키지의 test 스크립트가 `src/` 로 범위를 한정하므로 빌드 산출물(`dist/`) 의
# 컴파일된 .test.js 가 중복 실행되며 경로 의존(예: ./migrations) 어긋남으로 ENOENT 가 나는
# 문제를 회피합니다. 임시로 `bun test` 만 호출했을 때 dist 가 남아 있으면
# `rm -rf {apps,packages}/*/dist` 후 재실행 또는 `bun run clean` 사용.
root = "."
